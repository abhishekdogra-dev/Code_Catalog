<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube UI</title>
    <script defer src="index.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-900 text-white">
    <header
      class="flex items-center justify-between px-6 py-4 bg-gray-800 shadow-md sticky top-0 z-10"
    >
      <h1 class="text-xl font-bold text-red-500">YouTube Clone</h1>
    </header>

    <main class="p-6">
      <h2 class="text-2xl font-semibold mb-6">Recommended</h2>

      <div
        id="videos"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      ></div>
    </main>
  </body>
</html>
