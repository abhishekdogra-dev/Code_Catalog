<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meals Explorer</title>
    <script defer src="index.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-900 text-white min-h-screen">
    <!-- Header -->
    <header
      class="p-6 flex flex-col sm:flex-row gap-4 justify-between items-center border-b border-gray-700"
    >
      <h1 class="text-3xl font-bold text-yellow-400">🍽 Meals Explorer</h1>

      <input
        id="search"
        type="text"
        placeholder="Search meals..."
        class="px-4 py-2 rounded-lg bg-gray-800 border border-gray-600 focus:outline-none w-full sm:w-64"
      />
    </header>

    <!-- Loader -->
    <div id="loader" class="text-center p-10 text-gray-400">
      Loading meals...
    </div>

    <!-- Meals Grid -->
    <main
      id="meals"
      class="hidden p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
    ></main>

    <!-- Modal -->
    <div
      id="modal"
      class="hidden fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center p-4"
    >
      <div class="bg-gray-800 rounded-2xl max-w-2xl w-full p-6 relative">
        <button
          onclick="closeModal()"
          class="absolute top-3 right-3 text-2xl text-white hover:text-red-500"
        >
          X
        </button>

        <img id="modal-img" class="w-full h-60 object-cover rounded-lg mb-4" />

        <h2 id="modal-title" class="text-2xl font-bold mb-2"></h2>

        <p id="modal-meta" class="text-sm text-gray-400 mb-4"></p>

        <p id="modal-desc" class="text-gray-200 text-sm leading-relaxed"></p>
      </div>
    </div>
  </body>
</html>
