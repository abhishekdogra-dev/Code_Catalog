<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cat Viewer</title>
    <script defer src="index.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gradient-to-br from-purple-100 to-blue-200 min-h-screen flex items-center justify-center"
  >
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 text-center">
      <h1 class="text-2xl font-bold mb-4">🐱 Random Cat</h1>

      <img
        id="catImage"
        class="w-full h-64 object-contain rounded-xl mb-4"
        src=""
      />

      <h2 id="catName" class="text-xl font-semibold"></h2>

      <p id="catDesc" class="text-gray-600 text-sm mt-2"></p>

      <div id="traits" class="mt-4 text-xs text-gray-500"></div>

      <button
        onclick="getCat()"
        class="mt-6 bg-purple-500 text-white px-6 py-2 rounded-full hover:bg-purple-600 transition"
      >
        New Cat
      </button>
    </div>
  </body>
</html>
