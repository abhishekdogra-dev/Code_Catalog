<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Product Store</title>
    <script defer src="index.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <header
      class="bg-white shadow-md px-6 py-4 flex justify-between items-center sticky top-0"
    >
      <h1 class="text-xl font-bold text-blue-600">ShopEasy</h1>
    </header>
    <main class="p-6">
      <h2 class="text-2xl font-semibold mb-6">Trending Products</h2>

      <div
        id="products"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      ></div>
    </main>
  </body>
</html>
