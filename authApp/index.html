<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Auth App</title>
    <script defer src="app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-xl shadow-md w-96">
      <!-- Toggle -->
      <div class="flex justify-between mb-4">
        <button onclick="showLogin()" class="text-blue-500">Login</button>
        <button onclick="showRegister()" class="text-blue-500">Register</button>
      </div>

      <!-- LOGIN -->
      <div id="loginForm">
        <h2 class="text-xl font-bold mb-4">Login</h2>
        <input
          id="loginUsername"
          class="w-full mb-2 p-2 border rounded"
          placeholder="Username"
        />
        <input
          id="loginPassword"
          type="password"
          class="w-full mb-2 p-2 border rounded"
          placeholder="Password"
        />
        <button
          onclick="login()"
          id="loginBtn"
          class="w-full bg-blue-500 text-white p-2 rounded"
        >
          Login
        </button>
      </div>

      <!-- REGISTER -->
      <div id="registerForm" class="hidden">
        <h2 class="text-xl font-bold mb-4">Register</h2>
        <input
          id="regEmail"
          class="w-full mb-2 p-2 border rounded"
          placeholder="Email"
        />
        <input
          id="regUsername"
          class="w-full mb-2 p-2 border rounded"
          placeholder="Username"
        />
        <input
          id="regPassword"
          type="password"
          class="w-full mb-2 p-2 border rounded"
          placeholder="Password"
        />
        <button
          onclick="register()"
          id="registerBtn"
          class="w-full bg-green-500 text-white p-2 rounded"
        >
          Register
        </button>
      </div>

      <!-- DASHBOARD -->
      <div id="dashboard" class="hidden">
        <h2 class="text-xl font-bold mb-4">Dashboard</h2>
        <p id="userInfo"></p>
        <button
          onclick="logout()"
          class="mt-4 w-full bg-red-500 text-white p-2 rounded"
        >
          Logout
        </button>
      </div>

      <!-- Message -->
      <p id="message" class="mt-3 text-center text-sm"></p>
    </div>
  </body>
  <script src="./index.js"></script>
</html>
