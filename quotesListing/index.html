<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quotes App</title>
    <script defer src="app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gradient-to-br from-gray-900 to-gray-800 text-white min-h-screen"
  >
    <header class="text-center py-8">
      <h1 class="text-3xl font-bold">✨ Daily Quotes</h1>
      <p class="text-gray-400 mt-2">Read, reflect, grow</p>
    </header>

    <main class="max-w-4xl mx-auto px-4">
      <div id="quotes" class="space-y-6"></div>

      <div class="text-center mt-8">
        <button
          onclick="loadMore()"
          class="bg-white text-black px-6 py-2 rounded-full hover:bg-gray-200 transition"
        >
          Load More
        </button>
      </div>
    </main>
  </body>
</html>
